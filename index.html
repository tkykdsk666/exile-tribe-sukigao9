<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXILE TRIBE 好き顔9選</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#faf7fb;color:#28242a}
main{max-width:900px;margin:auto;padding:24px 16px 60px}.card{background:#fff;border:1px solid #e8e0e9;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 3px 18px #00000008}
h1{font-size:28px;margin:8px 0 4px}.sub{color:#756c77;margin:0 0 20px}
button{border:0;border-radius:12px;padding:12px 16px;font-size:15px;cursor:pointer;background:#29252b;color:white}
button.secondary{background:#eee9ee;color:#29252b}button.pink{background:#e96aa7}.row{display:flex;gap:10px;flex-wrap:wrap}
textarea{width:100%;min-height:180px;border:1px solid #ddd3df;border-radius:12px;padding:12px;font:14px/1.6 monospace}
input[type=file]{width:100%;padding:12px;border:1px dashed #c9bdca;border-radius:12px;background:#fcfafc}
.help{font-size:13px;color:#756c77;line-height:1.6}.hidden{display:none!important}
.progress{height:8px;background:#eee9ee;border-radius:9px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#e96aa7;width:0}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}.person{border:1px solid #e8e0e9;border-radius:18px;overflow:hidden;background:#fff;cursor:pointer}.person:hover{border-color:#e96aa7}.photo{aspect-ratio:1/1;background:#eee9ee;display:flex;align-items:center;justify-content:center;font-size:42px;color:#a69ba8}.photo img{width:100%;height:100%;object-fit:cover}.name{text-align:center;padding:14px 8px;font-weight:700}.group{text-align:center;color:#8a7f8b;font-size:12px;margin-top:-8px;padding-bottom:12px}
.result{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rank{border:1px solid #e8e0e9;border-radius:14px;overflow:hidden;background:#fff}.rank .photo{aspect-ratio:1/1}.ranktext{padding:10px}.ranknum{font-size:13px;color:#e96aa7;font-weight:700}
@media(max-width:600px){.compare{gap:8px}.result{grid-template-columns:repeat(2,1fr)}h1{font-size:24px}}
</style>
</head>
<body>
<main>
<section id="setup" class="card">
<h1>EXILE TRIBE 好き顔9選</h1>
<p class="sub">Eloレーティング方式・成員は自分で設定できます。</p>
<p class="help">① 下の名单に「グループ｜名前」を1行ずつ入力。② 写真をまとめて選択。③ 开始。写真文件名は姓名部分に合わせる必要はありません；程序会按“上传顺序”匹配，因此请按名单顺序选择图片。</p>
<textarea id="list">EXILE｜EXILE TAKAHIRO
EXILE｜EXILE AKIRA
EXILE｜EXILE TETSUYA
EXILE｜EXILE NESMITH
EXILE｜EXILE SHOKICHI
EXILE｜EXILE NAOTO
EXILE｜小林直己
EXILE｜白濱亜嵐
EXILE｜世界
EXILE｜佐藤大樹
GENERATIONS｜片寄涼太
GENERATIONS｜数原龍友
GENERATIONS｜小森隼
GENERATIONS｜佐野玲於
GENERATIONS｜中務裕太
FANTASTICS｜澤本夏輝
FANTASTICS｜瀬口黎弥
FANTASTICS｜堀夏喜
FANTASTICS｜木村慧人
FANTASTICS｜八木勇征
FANTASTICS｜中島颯太
KID PHENOMENON｜夫松健介</textarea>
<br><br>
<input id="photos" type="file" accept="image/*" multiple>
<div style="height:10px"></div>
<div class="row">
<label>比较次数 <select id="rounds"><option value="200">200（标准）</option><option value="400">400（高精度）</option></select></label>
</div>
<p class="help">目前示例名单仅放入部分成员，避免在没有确认名单时误把退团/兼任/其他LDH艺人混入。正式版可把完整现役 EXILE TRIBE 成员名单粘贴进去。图片仅在本机浏览器处理，不会上传。</p>
<button id="start" class="pink">开始比较</button>
</section>

<section id="game" class="hidden">
<div class="card">
<div id="count"></div><div class="progress"><div class="bar" id="bar"></div></div>
<div class="compare">
<div class="person" id="a"><div class="photo" id="pa">A</div><div class="name" id="na"></div><div class="group" id="ga"></div></div>
<div class="person" id="b"><div class="photo" id="pb">B</div><div class="name" id="nb"></div><div class="group" id="gb"></div></div>
</div>
<div class="row" style="margin-top:14px">
<button class="secondary" id="both">🩷 两个都喜欢</button>
<button class="secondary" id="skip">跳过</button>
<button class="secondary" id="undo">↩ 返回</button>
</div>
</div>
</section>

<section id="result" class="card hidden">
<h1>我的好き顔9選</h1>
<p class="sub">按 Elo 分数排序</p>
<div class="result" id="grid"></div>
<div style="height:14px"></div><button id="again" class="pink">再来一次</button>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
let people=[], imgs=[], score=[], counts=[], history=[], total=200, step=0, pair=null;
function parseList(){
  return $('#list').value.split(/\n/).map(x=>x.trim()).filter(Boolean).map(x=>{
    const p=x.split(/[｜|]/); return {group:(p[0]||'').trim(),name:(p[1]||p[0]).trim()};
  });
}
function elo(sa,sb,ra=32,draw=false){
  const ea=1/(1+Math.pow(10,(sb-sa)/400)), eb=1-ea;
  return draw ? [sa+ra*(.5-ea), sb+ra*(.5-eb)] : [sa+ra*(1-ea), sb+ra*(0-eb)];
}
function choosePair(){
  let min=Math.min(...counts), candidates=people.map((_,i)=>i).filter(i=>counts[i]===min);
  let a=candidates[Math.floor(Math.random()*candidates.length)];
  let b;
  do b=Math.floor(Math.random()*people.length); while(b===a);
  return [a,b];
}
function showPair(){
  pair=choosePair(); let [a,b]=pair;
  for(const [id,i] of [['a',a],['b',b]]){
    $('#n'+id).textContent=people[i].name; $('#g'+id).textContent=people[i].group;
    const box=$('#p'+id); box.innerHTML='';
    if(imgs[i]){const im=document.createElement('img');im.src=imgs[i];box.appendChild(im)}else box.textContent='No photo';
  }
  $('#count').textContent=`${step+1} / ${total}`; $('#bar').style.width=((step/total)*100)+'%';
}
function record(kind){
  const [a,b]=pair;
  history.push({score:[...score],counts:[...counts],step});
  if(kind==='a'||kind==='b'){
    const r=elo(score[a],score[b],32,false); if(kind==='b') score[b]=r[0],score[a]=r[1]; else [score[a],score[b]]=r;
  } else if(kind==='both'){ [score[a],score[b]]=elo(score[a],score[b],20,true); }
  counts[a]++;counts[b]++;step++;
  if(step>=total) finish(); else showPair();
}
function finish(){
  const order=people.map((p,i)=>({...p,i,s:score[i]})).sort((a,b)=>b.s-a.s);
  $('#game').classList.add('hidden');$('#result').classList.remove('hidden');
  $('#grid').innerHTML=order.slice(0,9).map((p,n)=>`<div class="rank"><div class="photo">${imgs[p.i]?`<img src="${imgs[p.i]}">`:'No photo'}</div><div class="ranktext"><div class="ranknum">#${n+1}</div><b>${p.name}</b><div class="group">${p.group}</div></div></div>`).join('');
}
function start(){
  people=parseList(); if(people.length<3){alert('至少需要3人');return}
  const files=[...$('#photos').files]; imgs=people.map((_,i)=>files[i]?URL.createObjectURL(files[i]):null);
  total=+$('#rounds').value;score=people.map(()=>1500);counts=people.map(()=>0);history=[];step=0;
  $('#setup').classList.add('hidden');$('#result').classList.add('hidden');$('#game').classList.remove('hidden');showPair();
}
$('#start').onclick=start;$('#a').onclick=()=>record('a');$('#b').onclick=()=>record('b');$('#both').onclick=()=>record('both');$('#skip').onclick=()=>{step++; if(step>=total)finish();else showPair()};
$('#undo').onclick=()=>{const h=history.pop();if(!h)return;score=h.score;counts=h.counts;step=h.step;showPair()};
$('#again').onclick=()=>{ $('#result').classList.add('hidden');$('#setup').classList.remove('hidden'); };
</script>
</body>
</html>
